name: CI

on:
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # pnpm version comes from packageManager in package.json
      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build server and client
        run: pnpm exec nx run-many -t build --projects=server,client

      - name: Server tests
        run: pnpm --filter ./apps/server exec jest --runInBand

      - name: Client tests
        run: pnpm --filter ./apps/client run test

name: Release

on:
  push:
    branches:
      - main
      - dev
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  # Release tags mirror the upstream Docmost version in package.json:
  # vX.Y.Z, or vX.Y.Z-teams.N for fork-only fixes before the next upstream release.
  verify-version:
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check tag against package.json version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "v$version" ] && ! [[ "$TAG" =~ ^v${version//./\\.}-teams\.[0-9]+$ ]]; then
            echo "::error::Tag $TAG does not match package.json version $version (expected v$version or v$version-teams.N)"
            exit 1
          fi

  publish:
    needs: [ci, verify-version]
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=${{ github.sha }},enable=${{ github.ref_type == 'branch' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  github-release:
    needs: publish
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          IMAGE: ghcr.io/${{ github.repository }}
        run: |
          notes="docs/releases/${TAG}.md"
          if [ ! -f "$notes" ]; then
            upstream="${TAG%%-teams.*}"
            notes="$(mktemp)"
            printf 'docmost-teams %s, based on [Docmost %s](https://github.com/docmost/docmost/releases/tag/%s).\n' \
              "$TAG" "$upstream" "$upstream" > "$notes"
          fi
          {
            cat "$notes"
            # shellcheck disable=SC2016 # literal Markdown code fence
            printf '\n## Container image\n\n```bash\ndocker pull %s:%s\n```\n' "$IMAGE" "${TAG#v}"
          } > "$RUNNER_TEMP/release-notes.md"
          gh release create "$TAG" \
            --verify-tag \
            --latest \
            --title "docmost-teams $TAG" \
            --notes-file "$RUNNER_TEMP/release-notes.md"
